name = "moveup-relay"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# One Durable Object per desk. Named by `desk_id`, so a desk and its viewers
# always land in the same room without a lookup table.
[[durable_objects.bindings]]
name = "DESK_ROOM"
class_name = "DeskRoom"

# One instance per rate-limit bucket (`<route>:<ip>`). A Durable Object rather
# than the platform `RateLimiter` binding, because pairing brute-force
# protection has to be provable in tests — see README §Rate limits.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeskRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]

# The viewer build, served under /app. Same React bundle the desktop ships;
# `vite build` writes it. Absent in a fresh checkout — the Worker answers
# `assets_unavailable` rather than 404, so a missing build cannot look like a
# missing route.
[assets]
binding = "ASSETS"
directory = "../dist"

# Credential storage: licence, desk and viewer rows — hashes and metadata only.
# `database_id` is filled by `wrangler d1 create moveup-relay` at deploy time
# (T16); until then the placeholder makes `wrangler deploy` fail loudly rather
# than deploy a relay whose credentials cannot be checked.
[[d1_databases]]
binding = "DB"
database_name = "moveup-relay"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"

[vars]
RELAY_VERSION = "0.1.0"
# A socket that has not sent `hello` this many ms after the upgrade is closed
# 4401. Protocol says 5 s.
HELLO_TIMEOUT_MS = "5000"
# A socket silent this long is closed 1001. Clients ping every 25 s.
IDLE_TIMEOUT_MS = "60000"
# Pairing: a code lives 5 minutes; 10 wrong ones lock the desk out for 15.
PAIRING_TTL_MS = "300000"
PAIRING_LOCKOUT_MS = "900000"
PAIRING_MAX_ATTEMPTS = "10"
