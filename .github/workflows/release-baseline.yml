name: Release baseline

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character MoveUp commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-unsigned:
    name: Build unsigned Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Validate immutable source revision
        shell: pwsh
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if ($env:RELEASE_REF -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'ref must be a full 40-character commit SHA.'
          }

      - name: Checkout MoveUp at requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: MoveUp
          fetch-depth: 1

      - name: Verify requested revision was checked out
        shell: pwsh
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          $actual = (git -C MoveUp rev-parse HEAD).Trim()
          if ($actual -ne $env:RELEASE_REF.ToLowerInvariant()) {
            throw "Checked out $actual, expected $env:RELEASE_REF."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: MoveUp/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: MoveUp/src-tauri -> target

      - name: Install locked dependencies
        working-directory: MoveUp
        run: pnpm install --frozen-lockfile

      - name: Run frontend and Rust test gates
        working-directory: MoveUp
        run: pnpm test:all

      - name: Build NSIS installer
        working-directory: MoveUp
        run: pnpm exec tauri build --bundles nsis

      - name: Create immutable artifact manifest
        shell: pwsh
        working-directory: MoveUp
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          ./scripts/new-release-manifest.ps1 `
            -ArtifactDirectory src-tauri/target/release/bundle/nsis `
            -Revision $env:RELEASE_REF `
            -OutputPath release-artifacts/manifest.json

      - name: Upload unsigned diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: moveup-unsigned-${{ inputs.ref }}
          path: |
            MoveUp/src-tauri/target/release/bundle/nsis/*.exe
            MoveUp/release-artifacts/manifest.json
          if-no-files-found: error
          retention-days: 7
