[package]
name = "desk"
version = "0.5.0"
description = "zntl Desk — VL53L1X ToF sensor reader"
authors = ["zentala"]
edition = "2021"

[lib]
name = "desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
notify-rust = "4"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
window-vibrancy = "0.6"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
winreg = "0.52"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
wiremock = "0.6"
chrono-tz = "0.10"

[[bench]]
name = "session_state_machine"
harness = false
